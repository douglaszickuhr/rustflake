[workspace]
resolver = "3"
members = ["crates/*"]

# Shared by both crates (`[lints] workspace = true`); clippy's default set already runs on top.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Snowflake connector with the ID token cache (SSO login without a browser when the app reopens).
# Copy of 1.1.0 in vendor/ with a minimal patch; see vendor/snowflake-connector-rs/PATCH.md.
[patch.crates-io]
snowflake-connector-rs = { path = "vendor/snowflake-connector-rs" }
