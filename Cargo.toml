[workspace]
resolver = "3"
members = ["crates/*"]

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Conector Snowflake com o cache de ID token (login SSO sem navegador ao reabrir o app).
# Cópia do 1.1.0 em vendor/ com o patch mínimo; ver vendor/snowflake-connector-rs/PATCH.md.
[patch.crates-io]
snowflake-connector-rs = { path = "vendor/snowflake-connector-rs" }
