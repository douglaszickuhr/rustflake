[package]
edition = "2024"
name = "snowflake-connector-rs"
version = "1.1.0"
authors = ["kenkoooo <kenkou.n@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust client for Snowflake"
readme = "README.md"
keywords = [
    "client",
    "database",
    "snowflake",
    "sql",
]
license = "MIT"
repository = "https://github.com/estie-inc/snowflake-connector-rs"

[package.metadata.docs.rs]
all-features = true

[features]
bench-internals = []
default = [
    "derive",
    "key-pair-auth",
]
derive = ["dep:snowflake-connector-rs-derive"]
external-browser-sso = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:nix",
    "dep:socket2",
    "tokio/macros",
    "tokio/net",
]
key-pair-auth = [
    "dep:pkcs8",
    "dep:rsa",
    "dep:sha2",
]
pkcs8-3des = [
    "key-pair-auth",
    "pkcs8/3des",
]
pkcs8-des = [
    "key-pair-auth",
    "pkcs8/des-insecure",
]

[lib]
name = "snowflake_connector_rs"
path = "src/lib.rs"

[[example]]
