# Example configuration: the conventions of a fictional company. Copy it to
# ~/Library/Application Support/rustflake/configurations/ and adjust.
name = "ACME"

[[roles]]
kind = "classification"
match = '(^|_)C(?P<level>\d+)(_|$)'
[[roles]]
kind = "warehouse"
match = '^(?P<warehouse>.+?_WH)_(?:(?P<op>OP)|MONITOR)'
[[roles]]
kind = "base"
match = '^(?P<department>.+)_DEPARTMENT_BASE_ROLE$|BASE_ROLE'
[[roles]]
kind = "functional"
match = '_FR$'
[[roles]]
kind = "access"
match = '_AR$'
write = "_RW"

[classification]
tag = "GOVERNANCE.TAGS.DATA_CLASSIFICATION"
labels = ["Public", "Internal", "Confidential", "Restricted"]
# Badge color per level (same order as labels): muted, info, success, warning, danger or "#RRGGBB".
colors = ["muted", "muted", "warning", "danger"]
values = { "C-1 Public" = 1, "C-2 Internal" = 2, "C-3 Confidential" = 3, "C-4 Restricted" = 4, "CONFLICT" = 4, "UNCLASSIFIED" = 4 }

[masking]
global = "CLASSIFICATION_C{level}_MASKING_AR"
group = { role = "SHARED_C{level}_MASKING_AR", databases = "*_SHARED" }
scoped_suffix = "_C{level}_MASKING_AR"
forced_by = ["AI_AGENT_FR"]

# Custom tabs in the table view: `sql` (runs and shows a grid) or `url` (opens in the browser).
[[tabs]]
name = "Freshness"
sql = "select max(_loaded_at) as last_load from {database}.{schema}.{table}"
match = "ANALYTICS.*.*"

[[tabs]]
name = "Catalog"
url = "https://catalog.example.com/assets/{database}.{schema}.{table}"
