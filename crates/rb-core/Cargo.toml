[package]
name = "rb-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust-i18n = "4.2"
rustls = "0.23"
rustls-native-certs = "0.8"
russh = "0.64.1"
security-framework = "3"
sqlformat = "0.5"
sqlparser = "0.63"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
# Already in the build (via gpui); runs listing queries side by side.
futures = "0.3"
# Already in the build (Snowflake connector); fetches configurations by URL.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
snowflake-connector-rs = { version = "=1.1.0", default-features = false, features = ["key-pair-auth", "external-browser-sso"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
toml = "1"
tracing = "0.1.44"

[dev-dependencies]
chrono = "0.4"
pollster = "1"
