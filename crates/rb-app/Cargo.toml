[package]
name = "rb-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustbeaver"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql"] }
lsp-types = "0.97"
rb-core = { path = "../rb-core" }
chrono = "0.4"
rust-i18n = "4.2"
sys-locale = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
toml = "1"

# Dock icon at runtime (the app runs without an .app bundle); these already come with gpui.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
