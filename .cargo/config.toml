# Assina o app antes do cargo run: o Keychain lembra o "Permitir Sempre" entre builds.
[target.'cfg(target_os = "macos")']
runner = "scripts/dev-run.sh"

# O aviso "future version of Rust" vem do crate `block` 0.1.6 (cocoa/metal via gpui-kit), não do nosso código.
[future-incompat-report]
frequency = "never"
