# Signs the app before cargo run, so the Keychain remembers "Always Allow" across builds.
[target.'cfg(target_os = "macos")']
runner = "scripts/dev-run.sh"

# The "future version of Rust" warning comes from the `block` 0.1.6 crate (cocoa/metal via gpui-kit), not from our code.
[future-incompat-report]
frequency = "never"
